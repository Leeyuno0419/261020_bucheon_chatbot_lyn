<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부천이 - 부천 맛집 챗봇</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2430; --muted:#6b7280; --accent:#03c75a; --user:#e8f0fe; --bot:#f1f3f5; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --text:#e8eaed; --muted:#9aa0a6; --user:#243049; --bot:#2a2e36; --border:#2f333b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; height:100dvh; display:flex; justify-content:center; }
  .app { width:100%; max-width:720px; display:flex; flex-direction:column; background:var(--card); border-inline:1px solid var(--border); }
  header { padding:14px 16px; border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; font-size:13px; color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
  .user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .bot.error { color:#d93025; }
  .map { display:inline-block; padding:1px 8px; margin:0 1px; border-radius:999px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; font-size:.95em; }
  .map:hover { filter:brightness(.92); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 8px; }
  .chips button { border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); }
  input { flex:1; padding:11px 14px; border:1px solid var(--border); border-radius:999px; background:var(--bg); color:var(--text); font-size:15px; }
  form button { padding:0 20px; border:0; border-radius:999px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>부천이 🍜</h1>
    <p>부천 맛집·카페·나들이를 물어보세요. 초록색 이름을 누르면 네이버 지도로 이동해요.</p>
  </header>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="예) 부천역 근처 점심 추천해줘" required>
    <button id="send">전송</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = [];

// 이름에 '부천'이 이미 있으면 붙이지 않는다 (검색어에 부천이 두 번 들어가는 것 방지)
const naverUrl = name => "https://map.naver.com/p/search/" +
  encodeURIComponent(name.includes("부천") ? name : "부천 " + name);

// [[가게이름]] 을 네이버 지도 링크로 바꿔서 넣는다 (textContent만 써서 HTML 주입 방지)
function renderBot(el, text, links = {}) {
  const parts = text.split(/\[\[(.+?)\]\]/g);
  parts.forEach((part, i) => {
    if (i % 2 === 0) {
      el.append(document.createTextNode(part));
    } else {
      const a = document.createElement("a");
      a.className = "map";
      a.href = links[part.trim()] || naverUrl(part.trim());
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "📍 " + part.trim();
      el.append(a);
    }
  });
}

function addMsg(role, text, isError, links) {
  const el = document.createElement("div");
  el.className = "msg " + role + (isError ? " error" : "");
  if (role === "bot" && !isError) renderBot(el, text, links); else el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function ask(q) {
  addMsg("user", q);
  history.push({ role: "user", content: q });
  send.disabled = true;
  const wait = addMsg("bot", "생각 중...");
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const data = await res.json();
    wait.remove();
    if (!res.ok) throw new Error(data.error || "오류가 발생했습니다.");
    addMsg("bot", data.answer, false, data.links);
    history.push({ role: "assistant", content: data.answer });
  } catch (e) {
    wait.remove();
    history.pop();  // 실패한 질문은 기록에서 제거
    addMsg("bot", e.message, true);
  } finally {
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  ask(q);
});

["부천역 근처 점심 추천해줘", "아이랑 갈 만한 곳 알려줘", "비 오는 날 갈 만한 카페는?"].forEach(t => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = t;
  b.onclick = () => ask(t);
  document.getElementById("chips").append(b);
});

addMsg("bot", "안녕하세요! 부천 맛집·나들이 뭐든 물어보세요 😊");
</script>
</body>
</html>
